<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WealthWise - UML Activity Diagram (Black & White)</title>
    <style>
        /* Strict Black & White Theme */
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .diagram-title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 24px;
            text-align: center;
            color: #000000;
        }

        .bottom-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 24px;
            text-align: center;
            color: #000000;
        }

        /* Diagram Workspace Canvas */
        .diagram-wrapper {
            width: 100%;
            max-width: 1040px;
            background: #ffffff;
            overflow-x: auto;
            display: flex;
            justify-content: center;
        }

        svg {
            display: block;
            margin: 0 auto;
            background: #ffffff;
            user-select: none;
        }

        /* SVG Typography & Styles */
        text {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            fill: #000000;
        }

        .lane-header {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .action-text {
            font-size: 11px;
            font-weight: 600;
            text-anchor: middle;
        }

        .decision-text {
            font-size: 10.5px;
            font-weight: 700;
            text-anchor: middle;
        }

        .label-text {
            font-size: 10px;
            font-weight: 700;
            font-style: italic;
        }

        .node-caption {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-anchor: middle;
        }
    </style>
</head>
<body>

    <div class="diagram-title">WEALTHWISE SYSTEM</div>

    <!-- Activity Diagram SVG Canvas -->
    <div class="diagram-wrapper">
        <svg id="activityDiagramSvg" width="1020" height="1350" viewBox="0 0 1020 1350" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Standard UML Arrow Marker -->
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
                </marker>
            </defs>

            <!-- ========================================== -->
            <!-- 1. SWIMLANES & GRID LAYOUT                  -->
            <!-- ========================================== -->
            <!-- Outer Boundary Box -->
            <rect x="40" y="30" width="940" height="1280" fill="#ffffff" stroke="#000000" stroke-width="2.5" />

            <!-- Header Row Separator -->
            <line x1="40" y1="80" x2="980" y2="80" stroke="#000000" stroke-width="2" />

            <!-- Vertical Lane Dividers -->
            <!-- Lane 1 (User / Investor): x: 40 to 350 (width 310, Center: 195) -->
            <!-- Lane 2 (WealthWise Core): x: 350 to 670 (width 320, Center: 510) -->
            <!-- Lane 3 (AI & DB Engine): x: 670 to 980 (width 310, Center: 825) -->
            <line x1="350" y1="30" x2="350" y2="1310" stroke="#000000" stroke-width="2" />
            <line x1="670" y1="30" x2="670" y2="1310" stroke="#000000" stroke-width="2" />

            <!-- Swimlane Header Titles -->
            <text x="195" y="61" class="lane-header" text-anchor="middle">User / Investor</text>
            <text x="510" y="61" class="lane-header" text-anchor="middle">WealthWise Core System</text>
            <text x="825" y="61" class="lane-header" text-anchor="middle">AI Engine &amp; Database</text>

            <!-- ========================================== -->
            <!-- 2. DIAGRAM NODES & ACTIONS                  -->
            <!-- ========================================== -->

            <!-- START / INITIAL NODE (Lane 1, Center: 195, y: 110) -->
            <circle cx="195" cy="115" r="14" fill="#000000" />
            <text x="195" y="142" class="node-caption">Start</text>

            <!-- ACTION 1: Open Application & Login (Lane 1) -->
            <rect x="100" y="160" width="190" height="52" rx="14" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <text x="195" y="183" class="action-text">Open WealthWise Web App &amp;</text>
            <text x="195" y="199" class="action-text">Enter Login / Register Info</text>

            <!-- ACTION 2: Authenticate & Verify JWT (Lane 2, Center: 510) -->
            <rect x="415" y="160" width="190" height="52" rx="14" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <text x="510" y="183" class="action-text">Authenticate Credentials &amp;</text>
            <text x="510" y="199" class="action-text">Verify Session Token (JWT)</text>

            <!-- DECISION NODE 1: Credentials Valid? (Lane 2, Center: 510, y: 265) -->
            <polygon points="510,240 575,275 510,310 445,275" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <text x="510" y="272" class="decision-text">Credentials</text>
            <text x="510" y="284" class="decision-text">Valid?</text>

            <!-- ACTION 1E: Error / Lockout Warning (Lane 1, Center: 195) -->
            <rect x="100" y="250" width="190" height="50" rx="14" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <text x="195" y="271" class="action-text">Show Error Notification &amp;</text>
            <text x="195" y="287" class="action-text">Check Max Retry Lockout</text>

            <!-- ACTION 3: Load Profile & Dashboard (Lane 2, Center: 510) -->
            <rect x="415" y="405" width="190" height="52" rx="14" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <text x="510" y="428" class="action-text">Load User Portfolio,</text>
            <text x="510" y="444" class="action-text">Profile &amp; Financial Overview</text>

            <!-- ACTION 4: Display Dashboard Page (Lane 1, Center: 195) -->
            <rect x="100" y="405" width="190" height="52" rx="14" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <text x="195" y="428" class="action-text">Display Dashboard Overview,</text>
            <text x="195" y="444" class="action-text">Summary Cards &amp; Navigation</text>

            <!-- ACTION 5: Select & Input Financial Records (Lane 1, Center: 195) -->
            <rect x="100" y="495" width="190" height="52" rx="14" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <text x="195" y="518" class="action-text">Input / Update Incomes,</text>
            <text x="195" y="534" class="action-text">Expenses, Assets &amp; Goals</text>

            <!-- ACTION 6: Validate & Persist to Database (Lane 2 & Lane 3) -->
            <rect x="415" y="495" width="190" height="52" rx="14" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <text x="510" y="518" class="action-text">Validate Inputs (NFR-04) &amp;</text>
            <text x="510" y="534" class="action-text">Persist Records to PostgreSQL</text>

            <rect x="730" y="495" width="190" height="52" rx="14" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <text x="825" y="518" class="action-text">Write Audit Trail Log &amp;</text>
            <text x="825" y="534" class="action-text">Trigger Recalculation Queue</text>

            <!-- ========================================== -->
            <!-- 3. FORK NODE (CONCURRENT EXECUTION BAR)     -->
            <!-- ========================================== -->
            <!-- Spans across Lane 2 and Lane 3 from x: 440 to 895, y: 585 -->
            <rect x="440" y="585" width="455" height="10" rx="3" fill="#000000" />
            <text x="910" y="594" class="node-caption">Fork</text>

            <!-- PARALLEL ACTION 7A: Wealth Score Computation (Lane 2, Center: 510) -->
            <rect x="415" y="630" width="190" height="52" rx="14" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <text x="510" y="653" class="action-text">Compute Wealth Health Score</text>
            <text x="510" y="669" class="action-text">(Savings, Debt &amp; Liquidity)</text>

            <!-- PARALLEL ACTION 7B: AI Stress Simulation & Conflict Detection (Lane 3, Center: 825) -->
            <rect x="730" y="630" width="190" height="52" rx="14" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <text x="825" y="653" class="action-text">Simulate Stress Scenarios &amp;</text>
            <text x="825" y="669" class="action-text">Detect Goal Conflicts (BR-05)</text>

            <!-- DECISION NODE 2: Goal Conflict / Risk Detected? (Lane 3, Center: 825, y: 735) -->
            <polygon points="825,710 890,745 825,780 760,745" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <text x="825" y="742" class="decision-text">Conflict / Risk</text>
            <text x="825" y="754" class="decision-text">Detected?</text>

            <!-- ACTION 8A: Generate AI Recommended Remediation Plan (Lane 3, Center: 825) -->
            <rect x="730" y="810" width="190" height="52" rx="14" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <text x="825" y="833" class="action-text">Generate AI Resilience Insights</text>
            <text x="825" y="849" class="action-text">&amp; Action Plan (Gemini / AI)</text>

            <!-- ACTION 8B: Save Supporting Snapshot (Lane 2, Center: 510) -->
            <rect x="415" y="810" width="190" height="52" rx="14" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <text x="510" y="833" class="action-text">Snapshot Metrics &amp; Save</text>
            <text x="510" y="849" class="action-text">Health Subscores to Storage</text>

            <!-- ========================================== -->
            <!-- 4. JOIN NODE (SYNCHRONIZATION BAR)         -->
            <!-- ========================================== -->
            <!-- Spans across Lane 2 and Lane 3 from x: 440 to 895, y: 900 -->
            <rect x="440" y="900" width="455" height="10" rx="3" fill="#000000" />
            <text x="910" y="909" class="node-caption">Join</text>

            <!-- ========================================== -->
            <!-- 5. MERGE NODE (Combining Flows)            -->
            <!-- ========================================== -->
            <!-- Diamond at Lane 2 Center: 510, y: 955 -->
            <polygon points="510,935 545,955 510,975 475,955" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <text x="510" y="959" class="decision-text" font-size="9">Merge</text>

            <!-- ACTION 9: Display Updated Results to User (Lane 1, Center: 195) -->
            <rect x="100" y="1005" width="190" height="52" rx="14" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <text x="195" y="1028" class="action-text">Display Health Gauge, Charts</text>
            <text x="195" y="1044" class="action-text">&amp; AI Recommendations</text>

            <!-- DECISION NODE 3: Continue Session or Logout? (Lane 1, Center: 195, y: 1105) -->
            <polygon points="195,1080 260,1115 195,1150 130,1115" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <text x="195" y="1112" class="decision-text">Continue</text>
            <text x="195" y="1124" class="decision-text">Session?</text>

            <!-- ACTION 10: Invalidate Session & Blacklist JWT (Lane 2, Center: 510) -->
            <rect x="415" y="1175" width="190" height="52" rx="14" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <text x="510" y="1198" class="action-text">Blacklist JWT Token &amp;</text>
            <text x="510" y="1214" class="action-text">Terminate Active Session</text>

            <!-- FINAL NODE / TERMINATOR (Lane 2, Center: 510, y: 1265) -->
            <circle cx="510" cy="1265" r="15" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <circle cx="510" cy="1265" r="8.5" fill="#000000" />
            <text x="510" y="1295" class="node-caption">End / Terminator</text>


            <!-- ========================================== -->
            <!-- 6. CONTROL FLOW ARROWS (ORTHOGONAL LINES)  -->
            <!-- ========================================== -->

            <!-- Flow: Start -> Action 1 -->
            <line x1="195" y1="129" x2="195" y2="160" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

            <!-- Flow: Action 1 -> Action 2 (User inputs credentials to System) -->
            <line x1="290" y1="186" x2="415" y2="186" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

            <!-- Flow: Action 2 -> Decision 1 (Check credentials) -->
            <line x1="510" y1="212" x2="510" y2="240" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

            <!-- Flow: Decision 1 [Invalid] -> Error Action 1E -->
            <line x1="445" y1="275" x2="290" y2="275" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
            <text x="360" y="267" class="label-text">Access Denied</text>

            <!-- Flow: Action 1E loops back up to Action 1 -->
            <line x1="195" y1="250" x2="195" y2="212" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
            <text x="202" y="235" class="label-text">Retry</text>

            <!-- Flow: Decision 1 [Valid] -> Action 3 -->
            <line x1="510" y1="310" x2="510" y2="405" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
            <text x="518" y="360" class="label-text">Verified</text>

            <!-- Flow: Action 3 -> Action 4 (Load overview to front page UI) -->
            <line x1="415" y1="431" x2="290" y2="431" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

            <!-- Flow: Action 4 -> Action 5 (User chooses action & fills inputs) -->
            <line x1="195" y1="457" x2="195" y2="495" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

            <!-- Flow: Action 5 -> Action 6 (Submit inputs to backend) -->
            <line x1="290" y1="521" x2="415" y2="521" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

            <!-- Flow: Action 6 -> Lane 3 DB Audit & Sync -->
            <line x1="605" y1="521" x2="730" y2="521" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

            <!-- Flow: Action 6 & DB into FORK BAR -->
            <line x1="510" y1="547" x2="510" y2="585" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
            <line x1="825" y1="547" x2="825" y2="585" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

            <!-- Fork Splits Flow: -->
            <!-- Fork -> Parallel Action 7A (Wealth Score) -->
            <line x1="510" y1="595" x2="510" y2="630" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

            <!-- Fork -> Parallel Action 7B (AI Simulation) -->
            <line x1="825" y1="595" x2="825" y2="630" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

            <!-- Flow: Action 7A -> Action 8B (Save metric snapshot) -->
            <line x1="510" y1="682" x2="510" y2="810" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

            <!-- Flow: Action 7B -> Decision 2 (Check for conflict/risk) -->
            <line x1="825" y1="682" x2="825" y2="710" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

            <!-- Flow: Decision 2 [Yes] -> Action 8A (Generate AI plan) -->
            <line x1="825" y1="780" x2="825" y2="810" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
            <text x="833" y="798" class="label-text">Yes</text>

            <!-- Flow: Decision 2 [No] -> Bypasses to Join Bar -->
            <path d="M 760 745 L 705 745 L 705 900" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" fill="none" />
            <text x="712" y="740" class="label-text">No</text>

            <!-- Flow: Action 8A -> Join Bar -->
            <line x1="825" y1="862" x2="825" y2="900" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

            <!-- Flow: Action 8B -> Join Bar -->
            <line x1="510" y1="862" x2="510" y2="900" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

            <!-- Flow: Join Bar into MERGE NODE -->
            <line x1="510" y1="910" x2="510" y2="935" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

            <!-- Flow: Merge Node -> Action 9 (Display consolidated insights to UI) -->
            <path d="M 475 955 L 195 955 L 195 1005" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" fill="none" />

            <!-- Flow: Action 9 -> Decision 3 (Continue Session?) -->
            <line x1="195" y1="1057" x2="195" y2="1080" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

            <!-- Flow: Decision 3 [Yes / Continue] -> loops back to Dashboard Action 4 -->
            <path d="M 130 1115 L 70 1115 L 70 431 L 100 431" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" fill="none" />
            <text x="75" y="1105" class="label-text">Yes (Stay)</text>

            <!-- Flow: Decision 3 [No / Logout] -> Action 10 (Blacklist JWT) -->
            <path d="M 195 1150 L 195 1201 L 415 1201" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" fill="none" />
            <text x="205" y="1165" class="label-text">No (Logout)</text>

            <!-- Flow: Action 10 -> Final Node / Terminator -->
            <line x1="510" y1="1227" x2="510" y2="1250" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

        </svg>
    </div>

    <div class="bottom-title">ACTIVITY DIAGRAM</div>
</body>
</html>
