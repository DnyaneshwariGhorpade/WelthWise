<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WealthWise Class Diagram</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px; 
            background-color: #f9f9f9; 
            text-align: center;
        }
        #diagram { 
            margin-top: 30px; 
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: inline-block;
        }
        img {
            max-width: 100%;
            height: auto;
        }
    </style>
    <!-- PlantUML Encoder for browser -->
    <script src="https://cdn.jsdelivr.net/npm/plantuml-encoder@1.4.0/dist/plantuml-encoder.min.js"></script>
</head>
<body>
    <div id="diagram">
        <p>Loading Class Diagram...</p>
    </div>
    
    <script>
        const umlCode = `
@startuml
skinparam classAttributeIconSize 0
skinparam linetype ortho
skinparam nodesep 45
skinparam ranksep 50
skinparam classBackgroundColor #FFFFFF
skinparam classBorderColor #000000
skinparam classBorderWidth 1.5
skinparam classHeaderBackgroundColor #F4F6F9
skinparam roundcorner 4
skinparam arrowColor #000000
skinparam arrowThickness 1.2
hide circle

' ==========================================
' IDENTITY & GOVERNANCE
' ==========================================
class User {
  - id: int
  - fullName: String
  - email: String
  - passwordHash: String
  - role: Role
  - accountStatus: AccountStatus
  - failedLoginAttempts: int
  - lastLoginAt: DateTime
  - createdAt: DateTime
  - updatedAt: DateTime
  + register(name: String, email: String, pass: String): boolean
  + login(email: String, pass: String): String
  + resetPassword(token: String, newPass: String): boolean
  + updateProfile(name: String): boolean
}

class Admin {
  + manageUsers(): List<User>
  + toggleUserStatus(userId: int, status: AccountStatus): boolean
  + viewAuditLogs(filters: Filter): List<AuditLog>
  + viewUsageStats(): Stats
  + configureAI(provider: AIProvider, key: String): boolean
}

class AuditLog {
  - logId: int
  - userId: int
  - action: String
  - resourceType: String
  - resourceId: int
  - ipAddress: String
  - createdAt: DateTime
  + log(action: String, res: String): void
  + getFormattedLog(): String
}

class AIConfig {
  - configId: int
  - provider: AIProvider
  - apiKeyEncrypted: String
  - isActive: boolean
  - updatedAt: DateTime
  + switchProvider(p: AIProvider): boolean
  + getActiveClient(): AIClient
}

' ==========================================
' FINANCIAL PORTFOLIO
' ==========================================
class Income {
  - incomeId: int
  - userId: int
  - source: String
  - amount: Decimal
  - frequency: Frequency
  - createdAt: DateTime
  + create(data: IncomeDTO): boolean
  + update(data: IncomeDTO): boolean
  + delete(id: int): boolean
}

class Expense {
  - expenseId: int
  - userId: int
  - category: String
  - amount: Decimal
  - frequency: Frequency
  - createdAt: DateTime
  + create(data: ExpenseDTO): boolean
  + update(data: ExpenseDTO): boolean
  + delete(id: int): boolean
}

class Asset {
  - assetId: int
  - userId: int
  - assetType: String
  - currentValue: Decimal
  - liquidityLevel: LiquidityLevel
  - updatedAt: DateTime
  + create(data: AssetDTO): boolean
  + update(data: AssetDTO): boolean
  + delete(id: int): boolean
}

class Liability {
  - liabilityId: int
  - userId: int
  - liabilityType: String
  - outstandingAmount: Decimal
  - interestRate: Decimal
  - updatedAt: DateTime
  + create(data: LiabilityDTO): boolean
  + update(data: LiabilityDTO): boolean
  + delete(id: int): boolean
}

class Investment {
  - investmentId: int
  - userId: int
  - investmentType: String
  - amountInvested: Decimal
  - riskLevel: RiskLevel
  - createdAt: DateTime
  + create(data: InvestmentDTO): boolean
  + update(data: InvestmentDTO): boolean
  + delete(id: int): boolean
}

' ==========================================
' GOALS, SCORING & ADVISORY
' ==========================================
class Goal {
  - goalId: int
  - userId: int
  - goalName: String
  - targetAmount: Decimal
  - currentAmount: Decimal
  - targetDate: Date
  - priority: int
  - status: GoalStatus
  - createdAt: DateTime
  + checkConflict(): List<GoalConflict>
  + updateProgress(amt: Decimal): boolean
  + markComplete(): boolean
}

class GoalConflict {
  - conflictId: int
  - userId: int
  - goalIdsInvolved: List<int>
  - recommendedPlan: JSON
  - resolutionStatus: ConflictStatus
  - detectedAt: DateTime
  + detect(): boolean
  + resolve(status: ConflictStatus): boolean
}

class WealthScore {
  - scoreId: int
  - userId: int
  - overallScore: int
  - savingsSubscore: int
  - debtSubscore: int
  - liquiditySubscore: int
  - growthSubscore: int
  - aiExplanation: String
  - calculatedAt: DateTime
  + calculateScore(userId: int): int
  + explain(): String
}

class StressTest {
  - resultId: int
  - userId: int
  - scenarioId: int
  - monthsOfRunway: Decimal
  - weakestPoint: String
  - aiRecommendation: String
  - isStale: boolean
  - runAt: DateTime
  + runSimulation(scId: int): StressResult
  + identifyWeakPoint(): String
}

' ==========================================
' RELATIONSHIPS & MULTIPLICITIES
' ==========================================

' Tier 1: Identity & Governance (AuditLog on left, Admin on right)
User "1" o-left- "0..*" AuditLog : -auditLogs
Admin -left-|> User
Admin "1" -down-> "1" AIConfig : configures >

' Tier 2: Financial Portfolio (directly below User)
User "1" *-- "0..*" Income : -incomes
User "1" *-- "0..*" Expense : -expenses
User "1" *-- "0..*" Asset : -assets
User "1" *-- "0..*" Liability : -liabilities
User "1" *-- "0..*" Investment : -investments

' Layout hints for financial classes
Income -[hidden]right- Expense
Expense -[hidden]right- Asset
Asset -[hidden]right- Liability
Liability -[hidden]right- Investment

' Tier 3: Goals, Analytics & Advisory
User "1" *-- "0..*" Goal : -goals
User "1" *-- "0..*" WealthScore : -wealthScore
User "1" *-- "0..*" StressTest : -stressTests

' Internal Goal & AI dependencies (short direct connections)
Goal "1" *-- "0..*" GoalConflict : triggers >
WealthScore -right..> AIConfig : <<uses>>
StressTest -down..> AIConfig : <<uses>>

@enduml
        `;
        
        const encoded = plantumlEncoder.encode(umlCode);
        const url = 'https://www.plantuml.com/plantuml/svg/' + encoded;
        
        document.getElementById('diagram').innerHTML = '<img src="' + url + '" alt="UML Class Diagram">';
    </script>
</body>
</html>
